org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# CloudStream's library AAR declares minCompileSdk=37; the classes this project binds to are
# plain Kotlin/JVM API and are verified by compilation, so allow the older compileSdk.
android.experimental.disableCompileSdkChecks=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.incremental=true
