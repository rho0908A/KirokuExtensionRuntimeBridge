name: Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compile and capture errors
        run: |
          set +e
          gradle --no-daemon --console=plain test > /tmp/out.txt 2>&1
          code=$?
          {
            echo "EXIT=$code"
            echo '--- error lines ---'
            grep -nE "^e: |^w: .*error|error:|FAILED|Compilation error|Unresolved reference|Type mismatch|Caused by" /tmp/out.txt | tail -120
            echo '--- tail ---'
            tail -60 /tmp/out.txt
          } > diag.txt
          git config user.name diag-bot
          git config user.email diag-bot@example.com
          git add -f diag.txt
          git commit -m "diag: capture build output" || true
          git push --force origin HEAD:diag
