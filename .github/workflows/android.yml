name: Android

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag for a GitHub Release with the built APK/AAR assets (for example v1.0.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install platform 34 and build-tools 35.0.0
        run: |
          set -u
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          echo "ANDROID_HOME: $SDK"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;35.0.0" || true
          ls "$SDK/platforms" "$SDK/build-tools" || true

      - name: Unit tests
        run: gradle --no-daemon test

      - name: Assemble runtime, sample and SDK
        run: >
          gradle --no-daemon
          :runtime-host:assembleDebug
          :runtime-host:assembleRelease
          :sample-host:assembleDebug
          :sample-host:assembleRelease
          :bridge-sdk:assembleRelease
          :bridge-ipc:assembleRelease

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kiroku-runtime-bridge
          path: |
            runtime-host/build/outputs/apk/debug/*.apk
            runtime-host/build/outputs/apk/release/*.apk
            sample-host/build/outputs/apk/debug/*.apk
            sample-host/build/outputs/apk/release/*.apk
            bridge-sdk/build/outputs/aar/*.aar
            bridge-ipc/build/outputs/aar/*.aar
            **/build/reports/tests/**
          if-no-files-found: error

      - name: Stage release files
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 'versionName = "' runtime-host/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')"
          echo "Version: $VERSION"
          mkdir -p dist
          # Exactly one installable APK: the Runtime Host release build. Debug builds and the sample
          # client stay as CI workflow artifacts only, so the release page has no duplicates.
          cp runtime-host/build/outputs/apk/release/runtime-host-release.apk "dist/KirokuRuntimeHost-$VERSION.apk"
          # Libraries for host apps that bind to the Runtime Host (not installable).
          cp bridge-sdk/build/outputs/aar/bridge-sdk-release.aar "dist/bridge-sdk-$VERSION.aar"
          cp bridge-ipc/build/outputs/aar/bridge-ipc-release.aar "dist/bridge-ipc-$VERSION.aar"
          ls -l dist

      # The REST API is used directly so the job never depends on a CLI being present or
      # authenticated on the runner image, and so a rejected request prints GitHub's own message.
      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          API: https://api.github.com/repos/${{ github.repository }}
        run: |
          set -euo pipefail
          BODY="$(jq -Rs --arg tag "$TAG" \
            '{tag_name: $tag,
              name: ("Kiroku Runtime Bridge " + $tag),
              body: .,
              draft: false,
              prerelease: false,
              make_latest: "true",
              target_commitish: env.GITHUB_SHA}' .github/RELEASE_NOTES.md)"

          RESPONSE="$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$BODY" \
            "$API/releases")"
          STATUS="${RESPONSE##*$'\n'}"
          PAYLOAD="${RESPONSE%$'\n'*}"
          echo "create release: HTTP $STATUS"
          if [ "$STATUS" != "201" ]; then
            echo "$PAYLOAD"
            exit 1
          fi

          UPLOAD="$(printf '%s' "$PAYLOAD" | jq -r '.upload_url' | sed 's/{?name,label}//')"
          if [ -z "$UPLOAD" ] || [ "$UPLOAD" = "null" ]; then
            echo "$PAYLOAD"
            exit 1
          fi

          for file in dist/*; do
            name="$(basename "$file")"
            code="$(curl -sS -o /tmp/upload.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary "@$file" \
              "$UPLOAD?name=$name")"
            echo "upload $name: HTTP $code"
            if [ "$code" != "201" ]; then
              cat /tmp/upload.json || true
              exit 1
            fi
          done
