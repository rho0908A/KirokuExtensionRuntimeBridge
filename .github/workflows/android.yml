name: Android

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install platform 34 and build-tools 35.0.0
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;35.0.0"

      - name: Unit tests
        run: gradle --no-daemon test

      - name: Assemble runtime, sample and SDK
        run: >
          gradle --no-daemon
          :runtime-host:assembleDebug
          :sample-host:assembleDebug
          :bridge-sdk:assembleRelease
          :bridge-ipc:assembleRelease

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kiroku-runtime-bridge
          path: |
            runtime-host/build/outputs/apk/debug/*.apk
            sample-host/build/outputs/apk/debug/*.apk
            bridge-sdk/build/outputs/aar/*.aar
            bridge-ipc/build/outputs/aar/*.aar
            **/build/reports/tests/**
          if-no-files-found: error
